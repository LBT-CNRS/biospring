name: CI (macOS, MacPorts)

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  macos-macports:
    name: macOS (MacPorts)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # MacPorts has no official GitHub Action; this community script
      # (used by several scientific-computing projects, e.g. PLUMED, for the
      # same purpose) downloads and installs the MacPorts base system and
      # wires /opt/local into PATH for subsequent steps.
      - name: Install MacPorts
        run: |
          curl -LO https://raw.githubusercontent.com/GiovanniBussi/macports-ci/master/macports-ci
          chmod +x macports-ci
          ./macports-ci install

      - name: Install dependencies
        run: sudo port install netcdf netcdf-cxx4

      - name: Configure
        run: >
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
