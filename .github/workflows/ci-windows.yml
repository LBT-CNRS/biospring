name: CI (Windows, vcpkg)

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  windows:
    name: Windows (vcpkg)
    runs-on: windows-latest
    env:
      # Cache vcpkg's built binaries in the GitHub Actions cache so repeated
      # runs reuse them instead of rebuilding every dependency from source
      # (transitive deps like libaec were hitting rate limits on their
      # upstream download mirror on every single run).
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: vcpkg install netcdf-c netcdf-cxx4 --triplet x64-windows

      - name: Configure
        run: >
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
