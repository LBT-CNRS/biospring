name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  linux:
    name: Linux (Ubuntu, apt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnetcdf-dev libnetcdf-c++4-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DOPENMP_SUPPORT=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos-homebrew:
    name: macOS (Homebrew)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: brew install netcdf netcdf-cxx libomp freesasa json-c

      - name: Configure
        run: >
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DOPENMP_SUPPORT=ON
          -DFREESASA_SUPPORT=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos-macports:
    name: macOS (MacPorts)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # MacPorts has no official GitHub Action; this community script
      # (used by several scientific-computing projects, e.g. PLUMED, for the
      # same purpose) downloads and installs the MacPorts base system and
      # wires /opt/local into PATH for subsequent steps.
      - name: Install MacPorts
        run: |
          curl -LO https://raw.githubusercontent.com/GiovanniBussi/macports-ci/master/macports-ci
          chmod +x macports-ci
          ./macports-ci install

      - name: Install dependencies
        run: sudo port install netcdf netcdf-cxx4

      - name: Configure
        run: >
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (vcpkg)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: vcpkg install netcdf-c netcdf-cxx4 --triplet x64-windows

      - name: Configure
        run: >
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
