name: CI (macOS, Homebrew)

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  macos-homebrew:
    name: macOS (Homebrew)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: brew install netcdf netcdf-cxx libomp freesasa json-c

      - name: Configure
        run: >
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DOPENMP_SUPPORT=ON
          -DFREESASA_SUPPORT=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
